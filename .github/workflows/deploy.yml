name: Deploy
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/space-dogfight

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Image name must be lowercase
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}" || true
      - name: Deploy to Render
        if: env.HAS_RENDER_HOOK == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMAGE}:${{ github.ref_name }}"
      - name: Wait until /health reports this commit
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS "${{ vars.APP_URL }}/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: live version=$v"
            if [ "$v" = "$(echo ${{ github.sha }} | cut -c1-12)" ]; then exit 0; fi
            sleep 10
          done
          echo "deployed version never matched ${{ github.sha }}" && exit 1
